[build]
command = "python -m pip install -r requirements-build.txt && python build_site.py"
publish = "site"

[build.environment]
PYTHON_VERSION = "3.12"

[[headers]]
for = "/*"

  [headers.values]
  Cache-Control = "no-store"
  Content-Security-Policy = "default-src 'self'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'self'; media-src 'self' blob:"
  Permissions-Policy = "camera=(self), microphone=()"
  Referrer-Policy = "no-referrer"
  X-Content-Type-Options = "nosniff"
  X-Frame-Options = "DENY"
